# print-farm — a 3D-printing quote shop in one container.
#
#   docker compose up -d
#
# Then open http://<this computer>:8080/admin. The first visit asks for the
# one-time setup code from the log (`docker compose logs | grep "setup code"`),
# creates the admin password and walks you through the printer, filaments and
# shop details. Everything is kept in ./data; back that folder up.
#
# Nothing below needs changing. Every setting lives in the browser (admin →
# Settings) and in ./data/config/settings.json; an environment variable here
# (or in a .env file beside this one) overrides it — see .env.example.
#
# Update: `docker compose pull && docker compose up -d`. The database is
# backed up to ./data/backups before a new version migrates it.
name: print

services:
  print-farm:
    image: ${PRINT_IMAGE:-ghcr.io/mokshmridul/print-farm:latest}
    container_name: print-farm
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      # Plain HTTP. Put your reverse proxy in front for HTTPS, and tell the shop
      # about it in admin → Settings → Server. On a server reachable from the
      # internet, publish to loopback or your LAN address only, e.g.
      # "127.0.0.1:8080:8080".
      - "${PRINT_PORT:-8080}:8080"
    volumes:
      # Everything durable: database, uploads, PDFs, settings, secrets, backups.
      - ${PRINT_DATA_DIR:-./data}:/data
      # Optional: OrcaSlicer exports to slice with, picked up at startup —
      # printer/, process/ and filament/ (docs/SELF-HOSTING.md). Read-only.
      - ${PRINT_PROFILES_DIR:-./profiles}:/profiles:ro
    environment:
      # All optional; empty means "use the browser setting" (.env.example).
      APP_ORIGIN: ${APP_ORIGIN:-}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-}
      DIRECT_ACCESS: ${DIRECT_ACCESS:-}
      PRINTER_MACHINE: ${PRINTER_MACHINE:-}
      PRINTER_MULTI_MATERIAL: ${PRINTER_MULTI_MATERIAL:-}
      PRINTER_DISPLAY_NAME: ${PRINTER_DISPLAY_NAME:-}
      ADVANCED_PROFILES: ${ADVANCED_PROFILES:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      GOOGLE_MAPS_EMBED_URL: ${GOOGLE_MAPS_EMBED_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_TO: ${MAIL_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_PICKUP_PINCODE: ${SHIPROCKET_PICKUP_PINCODE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      MAX_SESSION_UPLOAD_MB: ${MAX_SESSION_UPLOAD_MB:-}
      UPLOAD_WINDOW_MB: ${UPLOAD_WINDOW_MB:-}
      DOWNLOAD_WINDOW_MB: ${DOWNLOAD_WINDOW_MB:-}
      STORAGE_RESERVE_MB: ${STORAGE_RESERVE_MB:-}
      MAX_MODELS_PER_SESSION: ${MAX_MODELS_PER_SESSION:-}
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-}
      QUOTATION_RETENTION_DAYS: ${QUOTATION_RETENTION_DAYS:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      SLICE_TIMEOUT_SECONDS: ${SLICE_TIMEOUT_SECONDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    # OrcaSlicer passes 4 GB RSS on ~220 MB STLs, and a parse of a model at the
    # MAX_XML_ELEMENTS ceiling can take ~3.4 GB while a slice runs; the database,
    # web and Redis share this limit too. Slicer and parse children run under
    # `choom -n 1000`, so if it is exceeded the kernel reaps them first and the
    # customer gets a slice/parse error rather than the database being killed.
    mem_limit: ${PRINT_MEMORY:-12g}
    memswap_limit: ${PRINT_MEMORY:-12g}
    pids_limit: 1024
    ulimits:
      core: 0
    # The worker's orchestrator needs the default capability set (chown, setuid/
    # setgid, kill, setpcap) to drop every OrcaSlicer job to its own uid;
    # everything not needed is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    # Everything written lives in /data (durable) or these tmpfs mounts: /run
    # holds the supervisor's state, sockets and rendered configs; /tmp the
    # slicer's per-job copies of customer models, which never touch disk.
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,exec,size=64m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=${PRINT_TMP_SIZE:-3g},mode=1777
    stop_grace_period: 40s
    restart: unless-stopped
