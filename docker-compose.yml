# print-farm: one container, one data volume.
#
#   cp .env.example .env   # set APP_ORIGIN at least
#   docker compose up -d
#
# The image (docker/Dockerfile) runs the web app, the slicing worker,
# PostgreSQL, Redis and nginx under one supervisor. Only nginx listens outside
# the container, on :8080, in plain HTTP: put HTTPS in front of it (your
# reverse proxy, Cloudflare Tunnel, ...). See docs/DEPLOYMENT.md.
#
# `docker compose pull` fetches the published image; `docker compose build`
# builds the same image from this checkout instead.
#
# Pinned so the Compose project (and its named volume) stays stable
# regardless of the folder name the stack is launched from.
name: print

services:
  print-farm:
    image: ${PRINT_IMAGE:-ghcr.io/mokshmridul/print-farm:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      # Bound to loopback by default so the shop is never reachable from the
      # host's public interfaces. Set PROXY_BIND to the address your reverse
      # proxy reaches this host on (a Tailscale IP, a LAN IP) — never 0.0.0.0
      # for a public server.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    environment:
      # The public address customers use (https://…). Plain http is accepted
      # only for localhost and private-network addresses.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      # One host that may assert the client address (your proxy as seen from
      # inside the container). Empty: trust none, serve every peer. Set: every
      # other peer gets 403. REAL_IP_HEADER: X-Real-IP or CF-Connecting-IP.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Real-IP}
      # Admin login. Empty everywhere: a password is generated on first boot and
      # printed once in `docker compose logs`. ADMIN_PASSWORD is hashed on first
      # boot only; change it later with `docker compose exec print-farm print-farm admin-password`.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Normally generated and kept in the volume. Pin it only when moving an
      # existing install (settings sealed with the old one stay readable).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Printer: unset = the hand-tuned Bambu Lab A1 profiles. Otherwise an
      # exact OrcaSlicer machine preset (docker/selfhost/printers.tsv).
      PRINTER_MACHINE: ${PRINTER_MACHINE:-}
      PRINTER_MULTI_MATERIAL: ${PRINTER_MULTI_MATERIAL:-0}
      ADVANCED_PROFILES: ${PRINTER_ADVANCED:-0}
      PRINTER_DISPLAY_NAME: ${PRINTER_DISPLAY_NAME:-}
      # Integrations (optional).
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      GOOGLE_MAPS_EMBED_URL: ${GOOGLE_MAPS_EMBED_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_TO: ${MAIL_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_PICKUP_PINCODE: ${SHIPROCKET_PICKUP_PINCODE:-}
      # Limits and retention (defaults apply when empty).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      MAX_SESSION_UPLOAD_MB: ${MAX_SESSION_UPLOAD_MB:-}
      UPLOAD_WINDOW_MB: ${UPLOAD_WINDOW_MB:-}
      DOWNLOAD_WINDOW_MB: ${DOWNLOAD_WINDOW_MB:-}
      STORAGE_RESERVE_MB: ${STORAGE_RESERVE_MB:-}
      MAX_MODELS_PER_SESSION: ${MAX_MODELS_PER_SESSION:-}
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-}
      QUOTATION_RETENTION_DAYS: ${QUOTATION_RETENTION_DAYS:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      SLICE_TIMEOUT_SECONDS: ${SLICE_TIMEOUT_SECONDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    volumes:
      - data:/data
    # OrcaSlicer passes 4 GB RSS on ~220 MB STLs, and a parse of a model at the
    # MAX_XML_ELEMENTS ceiling can take ~3.4 GB while a slice runs; the database,
    # web and Redis share this limit too. Slicer and parse children run under
    # `choom -n 1000`, so if it is exceeded the kernel reaps them first and the
    # customer gets a slice/parse error rather than the database being killed.
    mem_limit: ${PRINT_MEMORY:-12g}
    memswap_limit: ${PRINT_MEMORY:-12g}
    pids_limit: 1024
    ulimits:
      core: 0
    # The worker's orchestrator needs the default capability set (chown, setuid/
    # setgid, kill, setpcap) to drop every OrcaSlicer job to its own uid;
    # everything not needed is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    # Everything written lives in /data (durable) or these tmpfs mounts: /run
    # holds the supervisor's state, sockets and rendered configs; /tmp the
    # slicer's per-job copies of customer models, which never touch disk.
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,exec,size=64m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=${PRINT_TMP_SIZE:-3g},mode=1777
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  data:
