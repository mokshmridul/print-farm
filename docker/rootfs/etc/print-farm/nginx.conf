# print-farm nginx main configuration. Workers run as www-data; the site
# itself (routes, body limits, client-IP trust) is rendered by init into
# /run/nginx/site.conf from docker/proxy/nginx.conf.
user www-data;
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /run/nginx/client_body;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;

  include /run/nginx/site.conf;
}
