# Site config for the print-farm image's nginx. init renders it into
# /run/nginx/site.conf on every boot (docker/rootfs/usr/local/lib/print-farm/
# render-nginx.sh), filling the @trusted-proxy markers from TRUSTED_PROXY_CIDR
# and REAL_IP_HEADER. Unset, no forwarder is trusted: the TCP peer is the
# client and every peer is served. Set, exactly that one host may assert the
# client address, and every other peer gets 403 — or, with DIRECT_ACCESS=1, is
# served as itself (its own address and scheme).

upstream web_upstream {
  server 127.0.0.1:3000;
  keepalive 16;
}

limit_conn_zone $binary_remote_addr zone=per_client:10m;

# Preserve the public scheme only when it came from the one explicitly trusted
# forwarder host. Direct/untrusted clients cannot spoof X-Forwarded-Proto.
geo $realip_remote_addr $trusted_forwarder {
  default 0;
  # @trusted-proxy-geo
}
map "$trusted_forwarder:$http_x_forwarded_proto" $forwarded_proto {
  default $scheme;
  "1:https" https;
  "1:http" http;
}
# 1 for a visit straight from a peer other than the trusted forwarder, which is
# only served with DIRECT_ACCESS=1 (a LAN device beside the tunnel): plain HTTP
# whatever APP_ORIGIN says, so the app gives it non-Secure cookies and no
# HTTPS-only headers. Every other request keeps APP_ORIGIN's scheme.
map $trusted_forwarder $direct_visit {
  default 0;
  # @trusted-proxy-direct
}

# Query strings may contain customer search data or other sensitive values.
# Log both the TCP peer and the adopted client address so a bad trust setting is
# visible without ever accepting a caller-supplied free-form log value.
log_format no_args 'peer=$realip_remote_addr client=$remote_addr '
                   '- $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"-" "$http_user_agent"';

server {
  listen 7654;

  # JSON/form endpoints are tiny. Only the exact upload route receives the
  # large transport allowance below.
  client_max_body_size 64k;
  client_body_timeout 15s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  limit_conn per_client 30;
  access_log /dev/stdout no_args;
  # Nginx request-level errors can include the complete request target. Keep only
  # critical failures so legacy query capabilities/PII cannot enter error logs;
  # application, edge and health logs retain routine diagnostics.
  error_log /dev/stderr crit;

  # Don't advertise the nginx version.
  server_tokens off;

  # Rate limiting keys off X-Real-IP, so it must always be the true browser
  # client. When the connection comes from the one trusted forwarder (your
  # reverse proxy or tunnel connector), adopt the client address it set; any
  # other source has its header ignored and its own address used instead.
  # Rendering rejects network prefixes, so only one transport peer can assert it.
  # @trusted-proxy-realip

  # With a forwarder configured (and DIRECT_ACCESS unset), nginx also fails
  # closed if the published port is reachable from any other transport peer. `return` is the only action in
  # this rewrite-phase `if`, which is safe.
  # @trusted-proxy-gate

  location = /api/uploads {
    # One MiB of multipart framing headroom above the app's 300 MiB hard cap.
    client_max_body_size 301m;
    client_body_timeout 120s;
    proxy_pass http://web_upstream;
    # The application streams multipart data through busboy and enforces its
    # own byte budget. Avoid buffering another 300 MiB copy on nginx's root disk.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Never preserve caller-supplied X-Forwarded-For prefixes. The application
    # receives one canonical, nginx-parsed client address plus the original
    # transport peer as an internal diagnostic header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location = /api/admin/showcase {
    # Showcase photos are raw image bytes, not multipart, so this needs only a
    # little headroom over the app's 8 MiB cap — enough that an oversized file
    # is refused by the application with a readable JSON error instead of
    # nginx's bare 413, which the admin UI cannot explain. Exact-match so no
    # other admin endpoint leaves the tight 64k server default.
    client_max_body_size 9m;
    # The server default of 15s is generous for a JSON body and much too tight
    # for several megabytes over a phone connection.
    client_body_timeout 120s;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location = /api/admin/slicer-profiles {
    # Advanced mode's OrcaSlicer preset uploads: raw .json or bundle bytes. A
    # little over the app's 2 MiB cap, so an oversized file gets the app's
    # readable JSON error rather than nginx's bare 413. Exact-match, like the
    # showcase, so no other admin endpoint leaves the 64k default.
    client_max_body_size 3m;
    client_body_timeout 60s;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location = /api/admin/backup {
    # Restoring a settings backup: every setting plus the live OrcaSlicer
    # presets in one JSON body, well past the 64k default once presets are in.
    # A little over the app's 8 MiB cap, so an oversized file gets the app's
    # readable JSON error rather than nginx's bare 413.
    client_max_body_size 9m;
    client_body_timeout 60s;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location = /api/admin/faq {
    # The FAQ editor saves every entry in one JSON body: up to 30 answers of
    # 2000 characters, and non-Latin text is up to 3 bytes a character, so a
    # full FAQ passes 64k. A little over the app's 256 KiB cap, so an oversized
    # save gets the app's readable JSON error rather than nginx's bare 413.
    client_max_body_size 260k;
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location ~ ^/api/models/[0-9a-fA-F-]+/file$ {
    limit_conn per_client 4;
    limit_rate_after 10m;
    limit_rate 20m;
    proxy_pass http://web_upstream;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Proxy-Peer-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Direct-Visit $direct_visit;
    proxy_set_header Connection "";
  }
}
