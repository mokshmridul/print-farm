name: Security and verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ORIGIN: https://example.invalid
  DATABASE_URL: postgresql://print_web:ci-runtime-password-00000000000000000000@localhost:5432/print
  REDIS_URL: redis://:ci-redis-password-000000000000000000000@localhost:6379
  SESSION_SECRET: ci-session-secret-000000000000000000000000000000000000000000000000
  ADMIN_PASSWORD_HASH: $2b$12$LQv3c1yqBWXv6LoYh5pCjOaFh5SwmP7j8WbWm5CDhP5Rw1G2uQ0eW

jobs:
  repository-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://print_web:ci-web-password-00000000000000000000000000@127.0.0.1:5432/print_integration
      REDIS_URL: redis://:ci-redis-password-000000000000000000000@127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: print_owner
          POSTGRES_PASSWORD: ci-owner-password-000000000000000000000000
          POSTGRES_DB: print_integration
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U print_owner -d print_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        env:
          REDISCLI_AUTH: ci-redis-password-000000000000000000000
        command: redis-server --requirepass ci-redis-password-000000000000000000000
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify proxy trust guard
        shell: bash
        run: |
          set -euo pipefail
          valid=(
            "192.0.2.10"
            "192.0.2.10/32"
            "2001:db8::10"
            "2001:db8::10/128"
            "::ffff:192.0.2.10/128"
          )
          invalid=(
            ""
            "192.0.2.0/24"
            "2001:db8::/64"
            "999.0.0.1"
            "proxy.internal"
            "192.0.2.10;include bad.conf"
            $'192.0.2.10\nset_real_ip_from 0.0.0.0/0;'
          )
          lib=docker/rootfs/usr/local/lib/print-farm
          for value in "${valid[@]}"; do
            TRUSTED_PROXY_CIDR="$value" "$lib/validate-trusted-proxy.sh" >/dev/null
          done
          for value in "${invalid[@]}"; do
            if TRUSTED_PROXY_CIDR="$value" "$lib/validate-trusted-proxy.sh" >/dev/null 2>&1; then
              echo "Proxy validator accepted an unsafe value" >&2
              exit 1
            fi
            # The renderer must refuse it too, rather than render a config.
            if TRUSTED_PROXY_CIDR="$value" "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf >/dev/null 2>&1 \
              && [ -n "$value" ]; then
              echo "nginx renderer accepted an unsafe value" >&2
              exit 1
            fi
          done
          if REAL_IP_HEADER="X-Forwarded-For" "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf >/dev/null 2>&1; then
            echo "nginx renderer accepted an unsupported real-IP header" >&2
            exit 1
          fi
          if DIRECT_ACCESS=yes TRUSTED_PROXY_CIDR=192.0.2.10 "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf >/dev/null 2>&1; then
            echo "nginx renderer accepted an invalid DIRECT_ACCESS" >&2
            exit 1
          fi
          # The 403 gate is there exactly when a forwarder is set without DIRECT_ACCESS.
          TRUSTED_PROXY_CIDR=192.0.2.10 "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf
          grep -q 'return 403' /tmp/site.conf
          DIRECT_ACCESS=1 TRUSTED_PROXY_CIDR=192.0.2.10 "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf
          ! grep -q 'return 403' /tmp/site.conf
          grep -q 'set_real_ip_from 192.0.2.10;' /tmp/site.conf
          grep -qx '  0 1;' /tmp/site.conf

          # Both trust modes render a configuration nginx accepts.
          for mode in ":0" "192.0.2.10/32:0" "192.0.2.10:1"; do
            TRUSTED_PROXY_CIDR="${mode%:*}" DIRECT_ACCESS="${mode##*:}" "$lib/render-nginx.sh" docker/proxy/nginx.conf /tmp/site.conf
            chmod a+r /tmp/site.conf
            docker run --rm -v /tmp/site.conf:/etc/nginx/conf.d/default.conf:ro \
              nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa nginx -t
          done

      - name: Verify proxy request-body limits
        # `nginx -t` cannot see this class of mistake: a route that accepts large
        # bodies but was never granted an allowance is valid configuration that
        # returns 413 for every real payload, with no application log to explain
        # it because the request never reaches the app. That is how the showcase
        # photo upload shipped broken.
        env:
          NGINX_IMAGE: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
        run: docker/proxy/body-limits-test.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.12.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Install OpenCASCADE DRAW (STEP converter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends occt-draw
          # DRAW dlopens plugins by unversioned soname; Ubuntu ships those
          # symlinks only in the -dev packages. Derive the versioned suffix
          # rather than hardcoding it: it tracks the OpenCASCADE release, and
          # an unmatched glob would be passed through literally, creating a
          # dangling "libTK*.so" link and leaving the STEP leg broken while the
          # job still went green. Mirrors docker/Dockerfile.
          linked=0
          for f in /usr/lib/x86_64-linux-gnu/libTK*.so.*; do
            [ -e "$f" ] || continue
            target="${f%%.so.*}.so"
            [ -e "$target" ] || sudo ln -sf "$f" "$target"
            linked=$((linked + 1))
          done
          if [ "$linked" -eq 0 ] || [ ! -e /usr/lib/x86_64-linux-gnu/libTKXSDRAW.so ]; then
            echo "FATAL: OpenCASCADE plugin symlinks missing; STEP leg would break" >&2
            exit 1
          fi

      - name: Generate Prisma client
        run: pnpm --filter @print/db generate

      - name: Deploy integration database schema
        env:
          DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
        run: pnpm --filter @print/db migrate:deploy

      - name: Provision integration database roles
        env:
          MIGRATION_DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
          WEB_DATABASE_URL: postgresql://print_web:ci-web-password-00000000000000000000000000@127.0.0.1:5432/print_integration
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
        run: node apps/web/scripts/provision-database.mjs

      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Integration test
        env:
          MIGRATION_DATABASE_URL: postgresql://print_owner:ci-owner-password-000000000000000000000000@127.0.0.1:5432/print_integration
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
        run: pnpm --filter @print/web test:integration

      - name: Full HTTP quotation flow
        shell: bash
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          REDIS_URL: redis://:ci-redis-password-000000000000000000000@127.0.0.1:6379/1
          WORKER_DATABASE_URL: postgresql://print_worker:ci-worker-password-0000000000000000000000@127.0.0.1:5432/print_integration
          STORAGE_RESERVE_MB: "1"
          MAX_UPLOAD_MB: "10"
          MAX_SESSION_UPLOAD_MB: "20"
          UPLOAD_WINDOW_MB: "20"
          WORKER_CONCURRENCY: "1"
        run: |
          set -euo pipefail
          # A configured printer (a stock OrcaSlicer set): with none the shop
          # takes no quotes, and every customer route answers SHOP_NOT_READY.
          export PRINTER_SPEC_FILE="$GITHUB_WORKSPACE/apps/worker/test-fixtures/profile-set/printer.json"
          export PROFILES_DIR="$GITHUB_WORKSPACE/apps/worker/test-fixtures/profile-set"
          flow_root="$(mktemp -d)"
          web_log="$flow_root/web.log"
          worker_log="$flow_root/worker.log"
          web_pid=""
          worker_pid=""

          cleanup() {
            status=$?
            trap - EXIT
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then kill -TERM -- "-$pid" 2>/dev/null || true; fi
            done
            for _ in {1..50}; do
              alive=0
              for pid in "$web_pid" "$worker_pid"; do
                if [[ -n "$pid" ]] && kill -0 -- "-$pid" 2>/dev/null; then alive=1; fi
              done
              if (( alive == 0 )); then break; fi
              sleep 0.1
            done
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then kill -KILL -- "-$pid" 2>/dev/null || true; fi
            done
            for pid in "$web_pid" "$worker_pid"; do
              if [[ -n "$pid" ]]; then wait "$pid" 2>/dev/null || true; fi
            done
            if (( status != 0 )); then
              tail -n 200 "$web_log" "$worker_log" >&2 || true
            fi
            rm -rf "$flow_root"
            exit "$status"
          }
          trap cleanup EXIT

          export UPLOAD_DIR="$flow_root/uploads"
          export PDF_DIR="$flow_root/pdfs"
          export SLICE_WORK_DIR="$flow_root/slice-jobs"

          setsid pnpm --filter @print/web dev >"$web_log" 2>&1 &
          web_pid=$!
          setsid env \
            NODE_ENV=test \
            STUB_SLICER=true \
            ORCA_BIN=/definitely-not-installed/orca \
            DATABASE_URL="$WORKER_DATABASE_URL" \
            pnpm --filter @print/worker start >"$worker_log" 2>&1 &
          worker_pid=$!

          STUB_SLICER=true pnpm --filter @print/web test:flow

      - name: Build
        run: pnpm build

  # Everything above this point runs against the source tree. Nothing in it
  # builds a container image or executes one, and twice in one day that let a
  # deploy-breaking change through a fully green pipeline:
  #
  #   * Next 16 type-checked apps/web/test-integration, which imports
  #     ../../worker/src — present in the monorepo, absent from the image's
  #     build context. `pnpm build` passed; `docker build` failed.
  #   * Every production slice failed for nine hours because OrcaSlicer staged
  #     its 3MF export through a shared /tmp path owned by whichever uid ran it
  #     first. Only the real image, running the real bundle and dropping to the
  #     real slicer uid, takes that path at all.
  #
  # So this job builds the actual image and runs it exactly as
  # docker-compose.yml does (read-only root, dropped capabilities), then drives
  # one real slice through the public API, a backup/restore and a restart
  # (scripts/ci/image-smoke.sh).
  images:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        # The image carries Ubuntu, OpenCASCADE, PostgreSQL and the OrcaSlicer
        # AppImage; the runner's preinstalled toolchains are the easiest few GB
        # to give back and none of them are used here.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        # The build is where a monorepo-only module resolution shows up, and
        # where the Dockerfile's OpenCASCADE symlink assertion actually runs —
        # a zero-match glob there is silent at runtime. The layer cache it
        # leaves is what the publish job pushes from.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: print-farm:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=print-farm
          cache-to: type=gha,scope=print-farm,mode=max

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Boot it and slice a real model
        # No STUB_SLICER: this is OrcaSlicer, in the image, under the slicer
        # uid, reached only by enqueuing through the public API.
        run: scripts/ci/image-smoke.sh print-farm:ci

  # Publishes only what every check above passed on: the same Dockerfile and
  # build cache, pushed as :sha-<7 hex> (what update.sh pins installs to) and
  # :latest.
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository-scan, verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=print-farm

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install and build
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
